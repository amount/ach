env:
  ECR_ACCOUNT_ID: "846015697306"

x-ecr: &ecr
  ecr#v2.9.0:
    login: true
    account_ids: '$ECR_ACCOUNT_ID'
    region: 'us-east-2'

x-test_env: &test_env
  environment:
    - BUILDKITE
    - BUILDKITE_BRANCH
    - BUILDKITE_BUILD_ID
    - BUILDKITE_COMMIT
    - BUILDKITE_PIPELINE_DEFAULT_BRANCH
    - BUILDKITE_PIPELINE_SLUG
    - BUILDKITE_PULL_REQUEST_BASE_BRANCH
    - GEM_ALLOWED_PUSH_HOST=https://artifactory.internal.amount.com/artifactory/api/gems/gems-local

steps:
  - label: ":gem: test with Ruby 2.6"
    command: '.buildkite/test'
    plugins:
      <<: *ecr
      docker#v5.11.0:
        <<: *test_env
        image: "846015697306.dkr.ecr.us-east-2.amazonaws.com/docker-hub/library/ruby:2.6"

  - label: ":gem: test with Ruby 2.7"
    command: '.buildkite/test'
    plugins:
      <<: *ecr
      docker#v5.11.0:
        <<: *test_env
        image: "846015697306.dkr.ecr.us-east-2.amazonaws.com/docker-hub/library/ruby:2.7"

  - label: ":gem: test with Ruby 3.0"
    command: '.buildkite/test'
    plugins:
      <<: *ecr
      docker#v5.11.0:
        <<: *test_env
        image: "846015697306.dkr.ecr.us-east-2.amazonaws.com/docker-hub/library/ruby:3.0"

  - wait

  # we run two separate builds because the gemspec includes allowed_push_host, which is specific to G1G2 or A3

  # package gem and store in G1G2 Artifactory if this is the main/master branch
  - label: ":gem: :package: Build gem and push to G1G2 Artifactory"
    if: build.branch == pipeline.default_branch
    env:
      # BUILDKITE_ARTIFACT_UPLOAD_DESTINATION is used by buildkite to specify artifact upload goes to artifactory
      BUILDKITE_ARTIFACT_UPLOAD_DESTINATION: "rt://gems-local/gems" 
    command:
      - "git config --global --add safe.directory /workdir"
      - "gem build ach.gemspec"
    artifact_paths: "ach-*.gem"
    plugins:
      <<: *ecr
      docker#v5.11.0:
        image: "846015697306.dkr.ecr.us-east-2.amazonaws.com/docker-hub/library/ruby:2.7"
        # the env vars used in the step container, gemspec allowed_push_host for G1G2
        environment:
          - GEM_ALLOWED_PUSH_HOST=https://artifactory.internal.amount.com/artifactory/api/gems/gems-local

  # package gem and store in A3 Artifactory if this is the main/master branch
  - label: ":gem: :package: Build gem and push to A3 Artifactory"
    key: a3-package-and-upload
    if: build.branch == pipeline.default_branch
    env:
      # BUILDKITE_ARTIFACT_UPLOAD_DESTINATION is used by buildkite to specify artifact upload goes to artifactory
      BUILDKITE_ARTIFACT_UPLOAD_DESTINATION: rt://rubygems-local/gems
    command:
      - "git config --global --add safe.directory /workdir"
      - "gem build ach.gemspec"
    artifact_paths: "ach-*.gem"
    plugins:
      <<: *ecr
      docker#v5.11.0:
        image: "846015697306.dkr.ecr.us-east-2.amazonaws.com/docker-hub/library/ruby:2.7"
        # the env vars used in the step container, gemspec allowed_push_host for A3
        environment:
          - GEM_ALLOWED_PUSH_HOST=https://artifactory.shared.linearft.tools/artifactory/api/gems/rubygems-local
